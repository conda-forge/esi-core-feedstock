schema_version: 1

context:
  version: "1.2.8"

package:
  name: esi-core
  version: ${{ version }}

source:
  url: https://code.usgs.gov/ghsc/esi/esi-core/-/archive/v${{ version }}/esi-core-v${{ version }}.tar.gz
  sha256: 8aa332d5a89c3ad5e4a677a1ac9e9b4f978e4ea21394b97b0f02efb8ae49314a

build:
  script:
    - if: not win
      then:
        - export SETUPTOOLS_SCM_PRETEND_VERSION=${{ version }}
      else:
        - set SETUPTOOLS_SCM_PRETEND_VERSION=${{ version }}
    - if: osx
      then:
        - export OMP_PREFIX=${PREFIX}
    - ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  number: 1
  skip: match(python, ">=3.14")

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - cython >=3
        - numpy
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - python
    - setuptools >=42
    - setuptools-scm >=3.4
    - cython >=3.0.0
    - numpy >=1.26
    - pip
    - if: linux
      then:
        - libgomp
    - if: osx
      then:
        - llvm-openmp
  run:
    - python
    - obspy >=1.3.1
    - six >=1.16
    - numpy

tests:
  - python:
      imports:
        - esi_core.shakemap.covariance_matrix
        - esi_core.shakemap.geodetic_distances
        - esi_core.gmprocess.metrics.oscillators
      pip_check: true

about:
  homepage: https://code.usgs.gov/ghsc/esi/esi-core
  summary: Repository for compiled code used by ESI projects.
  license: Unlicense
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - cbworden-usgs
    - ocefpaf
    - emthompson-usgs
